name: Deploy Production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Pull Vercel env
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build (prebuilt)
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Deploy prebuilt
        id: vercel
        run: |
          URL=$(npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --yes)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Alias production domain
        run: |
          npx vercel alias set "${{ steps.vercel.outputs.url }}" geraldo-christin.vercel.app --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }}
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy submit function
        run: npx supabase functions deploy submit --project-ref zuuwxxrpkbfmelyoibst
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Smoke check HTML + strict RSVP gate
        run: |
          HTML=$(curl -fsS "${{ secrets.VITE_SITE_URL }}")
          echo "$HTML" | head -c 800 | grep -qi geraldo
          echo "$HTML" | grep -q 'property="og:url"'
          echo "$HTML" | grep -qi 'geraldo-christin.vercel.app'
          CODE=$(curl -sS -o /tmp/submit.json -w "%{http_code}" \
            -X POST "${{ secrets.VITE_SUPABASE_URL }}/functions/v1/submit" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Origin: ${{ secrets.VITE_SITE_URL }}" \
            -d "{\"type\":\"rsvp\",\"honeypot\":\"\",\"formOpenedAt\":$(($(date +%s)*1000 - 5000)),\"payload\":{\"name\":\"Probe\",\"guest_count\":1,\"attendance\":\"hadir\"}}")
          echo "submit_status=$CODE"
          test "$CODE" = "403"
          grep -qi 'pribadi\|undangan\|Origin\|Tamu' /tmp/submit.json
